<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eclipse Lunar Total</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body bgcolor="black">
    
    <div class="eclipse-container">
        <p class="luna-info">La Luna pasa completamente a través de la umbra</p>
        <p class="Diagrama-ilustrativo">Diagrama Ilustrativo (No a escala)</p>

        <div class="Sol"></div>
        <p class="Sol-text">Sol</p>

        <div class="Tierra"></div>
        <p class="Tierra-text">Tierra</p>

        <div class="Luna"></div>
        <p class="Luna-text">Luna</p>
        <div class="Luna-tile"></div>

        <p class="Umbra">Umbra</p>
        <div class="Umbra-tile-1"></div>
        <div class="Umbra-tile-2"></div>
        <div class="Umbra-dot"></div>

        <p class="Penumbra">Penumbra</p>
        <div class="Penumbra-tile-1"></div>
        <div class="Penumbra-tile-2"></div>
        <div class="Penumbra-dot"></div>

        <div class="SombraSolar-Izquierda"></div>
        <div class="SombraSolar-Derecha"></div>
        <div class="SombraSolar-Superior"></div>
        <div class="SombraSolar-Inferior"></div>

        <div class="SombraLunar-Triangular-Superior"></div>
        <div class="SombraLunar-Square"></div>
        <div class="SombraLunar-Triangular-Inferior"></div>
    </div>
    
</body>
</html>
