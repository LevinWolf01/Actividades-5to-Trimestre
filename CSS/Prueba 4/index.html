<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Log-in </title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <center>
    <div class="login-container">
        <h2 class="login-tittle">Sing in</h2>
        <p  class="login-info"> Sing in with your user name and password </p>
        <div class="username-contraseña">
            <input type="text" class="username" placeholder="Username">
            <input type="password" class="contraseña" placeholder="Password">
            
            <label class="remember-me">
                <input type="checkbox"> Remember me
            </label>
            
            <button class="login-button"> Log in </button>
            
            <a href="#" class="forgot-password"> Forgot password? </a>
        </div>
    </div>

    <h5 class="new-Here">New Here? <a href="#" class="create-account">¡Create your account!</a></h5>
    </center>
</body>
</html>
