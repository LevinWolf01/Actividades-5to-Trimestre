<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Práctica CSS #3 </title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>

  <div class="grid-container">
    <input type="text" class="caja outer">
    <input type="text" class="caja inner">
    <input type="text" class="caja hover-simple">
    <input type="text" class="caja neo-transform">
    <input type="text" class="caja neon" >
    <input type="text" class="caja hover-transform">
  </div>

<!-- Botón PÚLSAME -->
  <div class="neon-container">
  <button class="btn-neon-inner">Púlsame</button>
</div>

<!-- Boton POWER OFF -->
<div class="power-container">
  <button class="btn-power">
    <span class="power-icon"></span>
  </button>
</div>

<!-- Texto con DROP SHADOW -->
<div class="shadow-comparison-container">
  <input type="text" class="caja input-drop-shadow" readonly>
  <input type="text" class="caja input-box-shadow" readonly>
  <p class="texto-drop-shadow">TEXTO CON DROP SHADOW</p>
</div>

<div class="rgba-inset-container">
  <input type="text" class="caja-texto input-rgba-inset" placeholder="Escribe algo aquí...">
</div>

<div class="marco-imagen"></div>
</body>
</html>
