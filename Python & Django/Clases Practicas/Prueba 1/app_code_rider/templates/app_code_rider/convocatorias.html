<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convocatorias</title>
</head>
<body>
    <div class = "contenedor">
        <h1> Convocatorias de Cpacitaciones </h1>
        
        {% if convocatorias %}
            {%for convocatoria in convocatorias%}


        <div class="tarjeta">
            <h2> {{convocatoria.titulo_capacitacion}} </h2>

            <div class="info">
                <p><strong> Tipo: </strong> {{convocatoria.tipo}}</p>
                <p><strong> Duracion: </strong> {{convocatoria.duracion}}</p>
            </div>

            <div class="acciones">
                <a href="{% url 'detalle_convocatoria' convocatoria.id %}" class="btn">
                    Ver Detalle
                </a>

                <form action="{% url 'eliminar_convocatoria' convocatoria.id %}" method="post" {% csrf_token %}>
                    <button type="submit" class="btn btn-eliminar">
                        Eliminar
                    </button>
                </form>
            </div>
        </div>
                {% endfor %}
            {% else %}
                <div class="mensaje">
                    <p> No existen convocatorias registradas </p>
                </div>
            {% endif %}
    </div>
</body>
</html>
